# Netlify Configuration for Fullstack Ticket Sales App

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# 1. Reverse proxy /api requests directly to deployed Spring Boot backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://ticket-sales-ywdy.onrender.com/api/:splat"
  status = 200
  force = true

# 2. SPA fallback rule: rewrites all route requests to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

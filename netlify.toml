# Netlify Configuration for Fullstack Ticket Sales App

[build]
  # Navigate to the frontend directory for npm install and build
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# 1. (Optional) Forward API requests to your deployed Spring Boot backend
# Uncomment and replace with your backend URL (e.g. Render / Railway / AWS):
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend-service.railway.app/api/:splat"
#   status = 200
#   force = true

# 2. SPA fallback rule: rewrites all route requests to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
